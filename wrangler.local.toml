name = "mal-api-local"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat_v2"]

[dev]
port = 8787

[triggers]
crons = ["0 3 * * *"]

[vars]
NODE_ENV = "development"
WRITE_FREEZE = "false"
JWT_SECRET = "local-d1-rehearsal-only"
GOOGLE_CLIENT_ID = "local-client-id"

[[d1_databases]]
binding = "DB"
database_name = "anime-list"
database_id = "local"
migrations_dir = "migrations/d1"
