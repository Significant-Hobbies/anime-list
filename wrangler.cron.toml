name = "mal-api"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat_v2"]

[dev]
port = 8787

[triggers]
crons = ["0 3 * * *"]

[vars]
NODE_ENV = "production"
WRITE_FREEZE = "false"

[[d1_databases]]
binding = "DB"
database_name = "anime-list"
database_id = "REPLACE_AFTER_APPROVAL"
migrations_dir = "migrations/d1"

# Secrets (set via `wrangler secret put <KEY>`):
# - JWT_SECRET
# - GOOGLE_CLIENT_ID
