name = "mal-api"
main = "src/worker.ts"
workers_dev = true
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat_v2"]

[dev]
port = 8787

[[routes]]
pattern = "anime.significanthobbies.com/api/*"
zone_name = "significanthobbies.com"

[triggers]
crons = ["0 3 * * *"]

[vars]
NODE_ENV = "production"
WRITE_FREEZE = "false"

[[d1_databases]]
binding = "DB"
database_name = "anime-list"
database_id = "e2d43435-a71b-4d27-8465-5ec8c3a1abdd"
migrations_dir = "migrations/d1"

# Secrets (set via `wrangler secret put <KEY>`):
# - JWT_SECRET
# - GOOGLE_CLIENT_ID
