name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm db:migrate:local
      - run: pnpm db:rehearse
      - run: node --test scripts/lib/d1-import.test.mjs
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec wrangler deploy --dry-run --config wrangler.local.toml --outdir .wrangler/dry-run
      - run: pnpm build
      - name: Check bundle size
        run: pnpm run size
