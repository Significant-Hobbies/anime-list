name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: python -m pip install lizard==1.23.0
      - run: pnpm db:migrate:local
      - run: pnpm db:rehearse
      - run: pnpm quality
      - name: Verify search and watchlist browser flows
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 "$E2E_BASE_URL/search" --output /dev/null
          pnpm exec playwright test e2e/search-recommendations.spec.ts e2e/personal-flows.spec.ts --project=desktop
      - run: pnpm exec wrangler deploy --dry-run --config wrangler.local.toml --outdir .wrangler/dry-run
