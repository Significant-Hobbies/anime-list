name: Backfill Catalog Title Metadata
on:
  workflow_dispatch:
    inputs:
      media:
        description: Catalog to backfill
        type: choice
        required: true
        default: both
        options: [both, anime, manga]

concurrency:
  group: anime-list-catalog-d1-writes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Fill missing metadata for existing catalog IDs
        env:
          MEDIA: ${{ inputs.media }}
          D1_REMOTE_APPROVED: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx src/scripts/backfillCatalogMetadata.ts --remote --media="$MEDIA"
