name: Update Catalog Data

on:
  schedule:
    # Daily at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Update anime data
        id: anime
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Starting anime data update..."
          set +e
          pnpm run db:update:remote 2>&1 | tee "$RUNNER_TEMP/anime-update.log"
          update_status=${PIPESTATUS[0]}
          set -e
          if [ "$update_status" -ne 0 ]; then
            if grep -q "Tenrai returned no usable anime rows" "$RUNNER_TEMP/anime-update.log"; then
              catalog_json=$(curl --fail --silent --show-error --max-time 20 \
                https://anime.significanthobbies.com/api/last-updated)
              anime_updated_at=$(jq -r '.anime // empty' <<< "$catalog_json")
              if ANIME_UPDATED_AT="$anime_updated_at" node -e "
                const raw = process.env.ANIME_UPDATED_AT;
                const updated = Date.parse(raw?.includes('T') ? raw : raw?.replace(' ', 'T') + 'Z');
                const ageHours = (Date.now() - updated) / 3_600_000;
                if (!Number.isFinite(ageHours) || ageHours > 24) process.exit(1);
                console.log('Existing anime catalog age: ' + ageHours.toFixed(1) + 'h');
              "; then
                echo "::warning::Tenrai is unavailable after bounded retries; keeping the existing catalog because it was refreshed within the last 24 hours."
                {
                  echo "### Anime catalog refresh"
                  echo "- Tenrai: unavailable after bounded retries"
                  echo "- Existing catalog: fresh enough to serve (${anime_updated_at} UTC)"
                  echo "- Result: degraded success; no D1 write attempted"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            exit "$update_status"
          fi
          echo "✓ Anime data updated successfully"

      - name: Update manga data
        id: manga
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
        run: |
          echo "Starting manga data update..."
          pnpm run db:update:manga:remote
          echo "✓ Manga data updated successfully"

      - name: Fail when anime refresh is stale
        if: always() && steps.anime.outcome == 'failure'
        run: |
          echo "::error::Catalog data update failed. Check workflow logs."
          exit 1

      - name: Notify on manga partial failure
        if: always() && steps.manga.outcome == 'failure'
        run: |
          echo "::warning::Manga data update failed (likely transient catalog API issue). Anime data may have succeeded; check workflow logs."
