name: Update Catalog Data

on:
  schedule:
    # Daily at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Update anime data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Starting anime data update..."
          pnpm run db:update:remote
          echo "✓ Anime data updated successfully"

      - name: Update manga data
        id: manga
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
        run: |
          echo "Starting manga data update..."
          pnpm run db:update:manga:remote
          echo "✓ Manga data updated successfully"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Catalog data update failed. Check workflow logs."

      - name: Notify on manga partial failure
        if: steps.manga.outcome == 'failure'
        run: |
          echo "::warning::Manga data update failed (likely transient Jikan API issue). Anime data may have succeeded; check workflow logs."
