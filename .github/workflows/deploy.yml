name: Deploy anime_list to Cloudflare Pages
# Rollback: Cloudflare Pages preserves every deployment. Roll back via
# dash.cloudflare.com → Pages → anime-list → Deployments → "Rollback to this
# deployment".
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/validate-d1-config.mjs
      - run: pnpm build
        env:
          # VITE_* values are inlined into the client bundle at build time via
          # import.meta.env. VITE_API_URL intentionally stays unset so deployed
          # browsers use the same-origin /api proxy for first-party auth cookies.
          VITE_GOOGLE_CLIENT_ID: 207924374505-0mur9a99sal0ckob0vt38pcdj360ond5.apps.googleusercontent.com
          VITE_SAASMAKER_API_KEY: pk_fb1fe870205272a447298bfac32122383426d6a1c1fb10ab
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply anime-list --remote --config wrangler.cron.toml
      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy src/worker.ts --config wrangler.cron.toml --tag ${{ github.sha }}
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=anime-list --branch=main --commit-dirty=true
      - name: Smoke production
        run: |
          set -euo pipefail
          for path in / /anime/1; do
            curl --fail --retry 5 --retry-delay 5 --max-time 20 "https://anime.significanthobbies.com${path}" >/dev/null
          done
          curl --fail --retry 5 --retry-delay 5 --max-time 20 "https://anime.significanthobbies.com/api/last-updated" >/dev/null
